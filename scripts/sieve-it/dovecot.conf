# Görüntünün varsayılanı: parola USER_PASSWORD ortam değişkeninden gelir (`passdb static`). Plandaki passwd-file
# parolayı dosyaya yazardı, güvenlik kapısı bunu yasaklıyor.
sieve_script personal {
  driver = file
  path = ~/sieve
  active_path = ~/.dovecot.sieve
}

# TLS'siz LMTP yalnız 127.0.0.1'e yayımlanır, sınama postasını buradan teslim ederiz
service lmtp {
  inet_listener lmtp {
    port = 31025
  }
}

# Tatil yanıtı dışarı çıkmaz: sendmail.sh alıcının kutusuna teslim eder
sendmail_path = /it/sendmail.sh


sieve_extensions {
  special-use = yes
}
